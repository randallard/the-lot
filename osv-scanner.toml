# OSV scanner config. Read by `osv-scanner` in CI (the osv-scan job in
# .github/workflows/ci.yml, which fails on *any* vulnerability — severity is not a
# threshold there, unlike `pnpm audit --audit-level=high`).
#
# This file exists because pnpm-workspace.yaml's `auditConfig.ignoreGhsas` governs
# `pnpm audit` and nothing else. Two scanners, two config formats, one posture — keep
# them in sync. Deleting this file to "keep one ignore in one place" is what took the
# osv-scan job red from 2026-07-26 to 2026-07-29 without anything reporting it.
#
# **There are currently no ignores, and that is the point.** Every advisory this repo
# has carried is now cleared by a version override in pnpm-workspace.yaml rather than
# waved through here. The file stays so the knowledge above survives, and so the next
# ignore has a documented home instead of being invented under pressure.
#
# If you add one: say what it is, why no override works, whether it can reach the
# shipped bundle, and what would make it removable. An ignore whose reason is not
# checkable is a control that is not a control.
#
# Verify locally — this matches CI line for line, and takes ten seconds:
#   docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.3.8 -r ./
