# OSV scanner ignores. Read by `osv-scanner` in CI (the osv-scan job in
# .github/workflows/ci.yml runs with fail-on-vuln: true).
#
# This file exists because pnpm-workspace.yaml's `auditConfig.ignoreGhsas`
# governs `pnpm audit` and nothing else. Two scanners, two config formats, one
# posture — keep the reasoning here and there in sync. The long-form version,
# including the export-shape detail, lives in pnpm-workspace.yaml next to the
# `overrides` entry that this ignore is the counterpart to.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
# CVE-2026-14257 — brace-expansion, unbounded expansion exhausts memory (High,
# CVSS 7.5). OSV publishes one range: introduced 0, fixed 5.0.8, so every version
# below 5.0.8 is affected and there is no backported patch for the 1.x/2.x lines.
#
# Not a quarantine wait and not a severity judgement. brace-expansion 5.x changed
# its export shape (1.x exported the function itself), so forcing 5.0.8 onto
# minimatch@3.1.5 breaks it with `expand is not a function` as soon as a pattern
# contains braces — which this repo's eslint config does (`**/*.{ts,tsx}`).
# Verified: a blanket override takes `pnpm lint` down with exit 2. The
# `brace-expansion@5` override upgrades what can be upgraded; the residual
# 1.x/2.x copies reached through minimatch@3 are what this ignores.
#
# Dev-only path (eslint / typescript-eslint / license-checker); nothing here
# reaches the shipped bundle.
reason = "No patched version is compatible with minimatch@3's API; dev-only path, never reaches the shipped bundle. Revisit when the toolchain's minimatch@3 dependency is gone. Full reasoning in pnpm-workspace.yaml."
