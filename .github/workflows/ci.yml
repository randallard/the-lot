# One workflow, both language paths. `detect` looks for Cargo.toml / package.json
# and the language jobs skip themselves when their manifest isn't there — so a
# TS-only or Rust-only project needs no edits, and a project that grows a second
# language needs none either.
#
# EVERY third-party action is pinned to a full-length commit SHA, not a tag.
# Tags are mutable: the tj-actions/changed-files compromise (CVE-2025-30066)
# worked by repointing existing version tags at a malicious commit, and GitHub's
# own guidance calls a SHA "the only way to use an action as an immutable
# release". The trailing comment records the human-readable version — keep it
# accurate when you bump, since the SHA alone tells you nothing.
#
# Note dtolnay/rust-toolchain@stable is a *branch*, which moves by design — the
# pin matters most there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    name: detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      ts: ${{ steps.d.outputs.ts }}
      api: ${{ steps.d.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: d
        run: |
          set -euo pipefail
          rust=false; ts=false; api=false
          [ -f Cargo.toml ] && rust=true
          [ -f package.json ] && ts=true
          # ADR-1019: an OpenAPI document at the top level or directly in openapi/.
          { [ -f openapi.yaml ] || compgen -G 'openapi/*.yaml' >/dev/null; } && api=true
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "rust=$rust ts=$ts api=$api"

  # ── Rust ────────────────────────────────────────────────────────────────────
  rust-gates:
    name: rust fast gates
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (branch!)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings # --locked: ADR-1006
      - name: test
        run: cargo test --locked --all-features

  rust-proofs:
    name: rust proofs (kani)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # ADR-1005: proofs get room; a non-terminating harness still stops here, not at GitHub's 360
    # Deliberately its own job: a slow or cranky proof run must never delay the
    # fast-gate feedback loop, and a separate check name says at a glance which
    # tier failed. Runs on every push — no paths filter, no schedule.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # ADR-1004: plain `cargo kani` with no #[kani::proof] harnesses prints "No proof
      # harnesses found" and EXITS 0, so without this step the job is green while proving
      # nothing. (Harness-free panic checks exist only in the experimental
      # `cargo kani autoharness -Z autoharness`.) Not using Kani? Record that in a project
      # ADR and delete this job.
      - name: require at least one proof harness
        run: |
          if ! git grep -q 'kani::proof' -- '*.rs'; then
            echo "::error::No #[kani::proof] harnesses found: Kani would pass while proving nothing. Write a harness for the pure core, or record a project ADR opting out of Kani and delete this job (ADR-1004)."
            exit 1
          fi
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Point this at the pure core crate.
          args: --workspace

  rust-supply-chain:
    name: rust supply chain
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources advisories

  # ── TypeScript ──────────────────────────────────────────────────────────────
  ts-gates:
    name: ts fast gates
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26 # ADR-1022: the Active LTS, and the engines floor too
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  ts-supply-chain:
    name: ts supply chain
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26 # ADR-1022: the Active LTS, and the engines floor too
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: known-vulnerability audit
        run: pnpm audit --audit-level=high
      - name: signatures + provenance
        # A different question from the audit above: that one asks "is this
        # version on a known-bad list", this asks "was this tarball actually
        # published by who the registry says, and built where it claims".
        run: pnpm audit signatures
      # PSF-2.0 is the Python-2.0 licence under its newer SPDX id; argparse 3.x (via js-yaml,
      # which markdownlint pulls in) uses it.
      - name: license allowlist
        # Four additions to the template's list, all permissive and all reached
        # through ordinary toolchain transitives:
        #   CC-BY-4.0           caniuse-lite (browser-support *data*, not code)
        #   (MIT AND CC-BY-3.0) spdx-ranges — both halves already allowed
        #   MIT*                webgl-constants — MIT by its LICENSE file, which
        #                       package.json fails to declare; the `*` is the
        #                       checker flagging "inferred, not stated"
        run: >
          pnpm exec license-checker-rseidelsohn
          --onlyAllow "MIT;MIT*;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Python-2.0;PSF-2.0;BlueOak-1.0.0;MPL-2.0;CC-BY-3.0;CC-BY-4.0;(MIT AND CC-BY-3.0)"
          --excludePrivatePackages

  # ── HTTP APIs ───────────────────────────────────────────────────────────────
  # ADR-1019: every OpenAPI document is linted against the api-standards ruleset, vendored at a
  # pinned tag by scripts/vendor-api-standards.sh. The copy is checked against its lock before
  # use, and Spectral is the standalone binary, pinned and checksum-verified like gitleaks (its
  # npm tree fails trustPolicy, ADR-1016). Bump SPECTRAL_VERSION and SPECTRAL_SHA256 together:
  #   gh api repos/stoplightio/spectral/releases/tags/v<version> \
  #     -q '.assets[]|select(.name=="spectral-linux-x64")|.digest'
  api-lint:
    name: api lint
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: vendored ruleset matches its lock
        run: |
          set -euo pipefail
          if [ ! -f .spectral.yaml ] || [ ! -f .spectral/api-standards.lock ]; then
            echo "::error::An OpenAPI document exists but the ruleset isn't vendored (ADR-1019). Run scripts/vendor-api-standards.sh <tag>."
            exit 1
          fi
          sha="$(sed -n 's/^sha256=//p' .spectral/api-standards.lock)"
          echo "${sha}  .spectral/api-standards.yaml" | sha256sum -c -
          sed -n 's/^tag=/api-standards /p' .spectral/api-standards.lock
      - name: install spectral (pinned, checksum-verified)
        env:
          SPECTRAL_VERSION: 6.17.0
          SPECTRAL_SHA256: e6244baecff57dfb89ba8379a09563270fbb4ac7f73fb8692510a6160059ec53 # spectral-linux-x64
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o spectral "https://github.com/stoplightio/spectral/releases/download/v${SPECTRAL_VERSION}/spectral-linux-x64"
          echo "${SPECTRAL_SHA256}  spectral" | sha256sum -c -
          chmod +x spectral
      - name: lint
        run: |
          set -euo pipefail
          shopt -s nullglob
          docs=()
          [ -f openapi.yaml ] && docs+=(openapi.yaml)
          docs+=(openapi/*.yaml)
          "$RUNNER_TEMP/spectral" lint --fail-severity=warn --ruleset .spectral.yaml "${docs[@]}"

  # ── Shared ──────────────────────────────────────────────────────────────────
  sbom:
    name: SBOM
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Syft scans the project directly — a single static binary, no npm or cargo
      # dependency of its own, so it sidesteps package-manager layout problems.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cdx.json

  osv-scan:
    name: OSV scan
    needs: detect
    # Only when there's a dependency manifest to scan. Without this the template
    # repo itself — which has no Cargo.toml or package.json — goes red on a scan
    # of nothing, and a template whose own CI is failing teaches the wrong thing.
    if: needs.detect.outputs.rust == 'true' || needs.detect.outputs.ts == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    # No timeout-minutes here (ADR-1005's one exception): GitHub rejects it on a job that calls a
    # reusable workflow; the called workflow's own jobs carry their limits.
    # v2.7.0 at least (ADR-1018): pnpm 12 writes a two-document lockfile, and v2.3.8 reads only the
    # first (pnpm's own packages), so it passes while scanning none of the project's.
    # Reusable workflow, pinned to the commit SHA like every action here; the trailing
    # comment is its tag. Bump both together, deliberately.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  # Runs on every project, with or without a manifest: a secret can be committed to any repo.
  # Not a marketplace action: gitleaks-action needs a paid license on organisation accounts, and
  # an action is one more mutable dependency. Instead the release binary is fetched at a pinned
  # version and verified against a pinned SHA-256 before it runs. Bump both together
  # (the checksum is on the release page, in gitleaks_<version>_checksums.txt). From the template.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false
      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      # --redact keeps a real finding's value out of the (possibly public) build log.
      - name: scan history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  deploy:
    name: deploy to Pages
    needs: [ts-gates, ts-supply-chain, secret-scan]
    # Opt in per project: Settings → Variables → DEPLOY_PAGES = true.
    # Remember `base` must match the repo name or every asset 404s.
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
