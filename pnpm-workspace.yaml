# pnpm 11 reads these from here rather than package.json's "pnpm" field.

# esbuild's postinstall must run for vite/vitest to work. Declaring it keeps
# `pnpm install` from stopping on ERR_PNPM_IGNORED_BUILDS, in CI and locally.
allowBuilds:
  esbuild: true
  square-one@https://codeload.github.com/randallard/square-one/tar.gz/9fe350fbef34c790675fb518b5f69108ef32aaea: set this to true or false
  # square-one is consumed as a pinned git dependency (planning ADR-0006) and its
  # dist/ is gitignored, so pnpm must run its `prepare` (a plain `tsc`) after cloning.
  #
  # 🔴 **Keyed by the tarball URL, and it has to be.** This comment used to claim the
  # opposite — "keyed by package name rather than the tarball URL pnpm suggests, that URL
  # embeds the commit hash and would need editing on every square-one tag" — while the
  # line beneath it was the URL, with v0.2.0's hash in it. The comment described the
  # intention and the key described what pnpm accepts, and nobody noticed because the
  # local symlink meant pnpm never fetched the tarball. Bumping the pin to v0.3.0 fetched
  # it and the install stopped; `square-one: true` was tried first and rejected.
  #
  # So the maintenance burden the old comment denied is real: **this line changes on every
  # square-one tag**, and the hash is the tag's *commit*, not the tag object's own.
  # `git rev-parse v0.10.0^{}` in square-one gives it.
  #
  # 🔴 **One line, for the tag the pin names.** Two stale keys had accumulated here — v0.2.0's
  # and v0.3.0's — and v0.2.0's carried pnpm's suggestion text (`set this to true or false`)
  # verbatim as its *value*, which YAML reads as a string and pnpm ignores. Dead either way, and
  # it survived two bumps because nothing fails when a key nobody fetches is wrong. A key that
  # is not the current pin cannot be exercised, so keeping it only preserves the chance of a
  # future edit landing on the wrong line.
  square-one@https://codeload.github.com/randallard/square-one/tar.gz/f11da07ddb94f31ba3d7c444b7da781977aacf0c: true

# Age-gate new releases at the package manager. 1440 minutes (1 day) is pnpm's
# own recommendation and its v11 default; stated explicitly rather than inherited
# so a future default change cannot move it silently, and so the value is visible
# to anyone reading the repo. Verify with `pnpm config get minimumReleaseAge`.
minimumReleaseAge: 1440

# Also stated explicitly so a default change can't move them (template ADR-1016).
# trustPolicy: a package whose new version drops the provenance or trusted-publisher evidence
# its earlier versions had fails to install, the shape a hijacked maintainer account leaves.
trustPolicy: no-downgrade
# One reviewed exception, pinned to the exact version so a later semver@6 release is still checked.
# semver 6.3.1 is npm's own backport of the ReDoS fix (CVE-2022-25883), published 2023-07-10
# from the 6.x branch after 7.x had started carrying provenance, so it reads as a downgrade. It
# arrives via @babel/core (vite's react plugin, eslint-plugin-react-hooks), dev-path only. Retire
# this when @babel/core stops depending on semver@6.
trustPolicyExclude:
  - semver@6.3.1
# blockExoticSubdeps: only direct dependencies may come from git or a tarball URL. square-one is
# direct, so it's allowed; a transitive dependency pulling from git is refused.
blockExoticSubdeps: true

overrides:
  # Every entry here is a **bounded** range, and the bound is load-bearing.
  #
  # `">=1.1.18"` on its own does not mean "the 1.x line, patched" — semver compares
  # across majors, so pnpm happily satisfies it with 5.0.9 and every 1.x consumer gets
  # the 5.x export shape. brace-expansion 1.x exports the function itself and 5.x does
  # not, so that resolution takes `pnpm lint` down with `TypeError: expand is not a
  # function` the moment a config pattern contains braces — which this repo's does
  # (`**/*.{ts,tsx}`). Measured, twice: once on 2026-07-29 with a blanket override, and
  # again on 2026-08-15 with an unbounded one. Always pin the upper bound.
  #
  # All of these are dev-path only (eslint / typescript-eslint / license-checker / vite);
  # none reaches the shipped bundle.

  # GHSA-rgw5-rvv9-x895 — brace-expansion DoS via unbounded intermediate arrays,
  # explicitly a bypass of the CVE-2026-14257 mitigation. Patched per line: 1.1.18 for
  # the 1.x consumers reached through minimatch@3, 5.0.9 for the rest.
  #
  # 🔴 **This is why the repo no longer ignores GHSA-mh99-v99m-4gvg.** That ignore's
  # stated reason was "no patched version is compatible with minimatch@3's API", which
  # was true when it was written and stopped being true when the 1.x backport landed.
  # A patched 1.x means the override reaches everywhere and the ignore reaches nothing —
  # osv-scanner reports it as an unused ignore, which is how it was noticed.
  "brace-expansion@1": ">=1.1.21 <2"
  "brace-expansion@2": ">=2.1.4 <3"
  "brace-expansion@5": ">=5.0.12 <6"

  # js-yaml, via eslint's `@eslint/eslintrc`. **Two advisories, and the second is why the
  # bound moved on 2026-09-12:** GHSA-5p4m-2wfm-xmqj (quadratic CPU in `!!omap` resolution)
  # is fixed in 4.3.1, and GHSA-2883-xcg3-v3hh (`maxTotalMergeKeys` does not limit CPU use
  # for merge keys) is fixed in 4.3.2. A range satisfying only the first passes the day it is
  # written and goes red when the next one lands on the same package — which is exactly what
  # happened here, on the first push after 08-22.
  "js-yaml@4": ">=4.3.2 <5"

  # GHSA-mwp4-54f8-5fhr — ip-address decodes leading-zero octets as decimal where
  # resolvers read them as octal, so an SSRF filter and the resolver disagree. Via
  # license-checker-rseidelsohn → … → socks-proxy-agent.
  "ip-address": ">=10.7.4 <11"

  # GHSA-2v37-7h3g-55p8 — nanoid can loop indefinitely with a custom generator. Via
  # postcss → vite, so build-time only.
  "nanoid@3": ">=3.3.18 <4"

  # Found by osv-scanner and not by `pnpm audit`, because the audit job's
  # `--audit-level=high` filters them out while the OSV job fails on any severity.
  # A live demonstration that the two gates are not redundant.
  "postcss@8": ">=8.5.23 <9" # GHSA-fxqj-rqcc-2cmp

  # 2026-10-29: the advisories that landed since 09-12 (main's CI red on audit and OSV).
  # Brace-expansion and ip-address above moved up for GHSA-qhr7-859c-m2p7, -6j4f-fj2g-mc7p,
  # -q2hr-2g5m-vwhr and GHSA-rpw4-54j3-4h4q, -2vr4-cq9g-pvrc, -j6r3-76f7-8jcv, -h3mg-xc3c-68pw,
  # -rxp7-6hxx-x8q5. vite, vitest (and @vitest/mocker with it) and happy-dom are direct, so they
  # moved in package.json instead. All dev-path.
  "source-map-js@1": ">=1.2.2 <2" # GHSA-68fv-2mgg-jv7q, via postcss → vite and magicast
  "zod@4": ">=4.6.6 <5" # GHSA-mrhx-c7xc-m3w5, via eslint-plugin-react-hooks
  "postcss-selector-parser@7": ">=7.1.6 <8" # GHSA-rj75-hqrm-r3gf, via license-checker → @npmcli/query
  # 2026-10-30, published 23:09 UTC, fixed only in a new major. glob 13 comes via
  # license-checker → @npmcli; 14 keeps its API for those callers and brings minimatch 11 (fixed).
  "glob@13": ">=14.0.2 <15" # GHSA-3g3m-2fjr-6pw4
  "undici@6": ">=6.29.1 <7" # GHSA-8xcm-r25x-g524, -m8rv-5g2x-5cg5, -v3r7-h72x-cjcm; 10-29: -rfgv-xxqx-mfg5, -xjj6-f33q-929c, -2m5v-pch6-74hx, -qrxm-fqhp-jwvm, -4qv8-2p9j-2685, -9fm3-97px-rjf6, -3wwx-pv8p-q78v, -r53p-7pc4-xj5r

auditConfig:
  # Governs `pnpm audit` only. CI also runs osv-scanner, which reads its own ignores
  # from osv-scanner.toml — the same posture in a second format. Change one, change
  # the other.
  #
  # Empty from 2026-08-15 (the brace-expansion ignore retired by a backport) until:
  #
  # GHSA-g3hv-75wg-m249 (2026-10-30, medium): minimatch denial of service via globparts
  # amplification. Fixed only in minimatch 11.0.1, with no 3.x or 10.x backport. minimatch 3
  # comes via eslint and typescript-eslint, minimatch 10 via license-checker → @npmcli. All
  # dev tooling: nothing reaches the shipped bundle, and every pattern it matches is ours
  # (lint globs, the lockfile), never an attacker's. Forcing 3.x to 11 breaks eslint (the
  # export changed). Retire when eslint and typescript-eslint depend on minimatch >= 11.0.1,
  # or a 3.x/10.x backport lands (then a version override, as brace-expansion's was).
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
