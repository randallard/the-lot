# pnpm 11 reads these from here rather than package.json's "pnpm" field.

# esbuild's postinstall must run for vite/vitest to work. Declaring it keeps
# `pnpm install` from stopping on ERR_PNPM_IGNORED_BUILDS, in CI and locally.
allowBuilds:
  esbuild: true
  # square-one is consumed as a pinned git dependency (planning ADR-0006) and its
  # dist/ is gitignored, so pnpm must run its `prepare` (a plain `tsc`) after cloning.
  #
  # 🔴 **Keyed by the tarball URL, and it has to be.** This comment used to claim the
  # opposite — "keyed by package name rather than the tarball URL pnpm suggests, that URL
  # embeds the commit hash and would need editing on every square-one tag" — while the
  # line beneath it was the URL, with v0.2.0's hash in it. The comment described the
  # intention and the key described what pnpm accepts, and nobody noticed because the
  # local symlink meant pnpm never fetched the tarball. Bumping the pin to v0.3.0 fetched
  # it and the install stopped; `square-one: true` was tried first and rejected.
  #
  # So the maintenance burden the old comment denied is real: **this line changes on every
  # square-one tag**, and the hash is the tag's *commit*, not the tag object's own.
  # `git rev-parse v0.3.0^{}` in square-one gives it.
  square-one@https://codeload.github.com/randallard/square-one/tar.gz/1cccea1d779f8394ed09642b2e0d566f0635a8f4: true
  square-one@https://codeload.github.com/randallard/square-one/tar.gz/660fe3324b801b86393620f9a97fb687639bc349: set this to true or false

# Age-gate new releases at the package manager. 1440 minutes (1 day) is pnpm's
# own recommendation and its v11 default; stated explicitly rather than inherited
# so a future default change cannot move it silently, and so the value is visible
# to anyone reading the repo. Verify with `pnpm config get minimumReleaseAge`.
minimumReleaseAge: 1440

overrides:
  # Every entry here is a **bounded** range, and the bound is load-bearing.
  #
  # `">=1.1.18"` on its own does not mean "the 1.x line, patched" — semver compares
  # across majors, so pnpm happily satisfies it with 5.0.9 and every 1.x consumer gets
  # the 5.x export shape. brace-expansion 1.x exports the function itself and 5.x does
  # not, so that resolution takes `pnpm lint` down with `TypeError: expand is not a
  # function` the moment a config pattern contains braces — which this repo's does
  # (`**/*.{ts,tsx}`). Measured, twice: once on 2026-07-29 with a blanket override, and
  # again on 2026-08-15 with an unbounded one. Always pin the upper bound.
  #
  # All of these are dev-path only (eslint / typescript-eslint / license-checker / vite);
  # none reaches the shipped bundle.

  # GHSA-rgw5-rvv9-x895 — brace-expansion DoS via unbounded intermediate arrays,
  # explicitly a bypass of the CVE-2026-14257 mitigation. Patched per line: 1.1.18 for
  # the 1.x consumers reached through minimatch@3, 5.0.9 for the rest.
  #
  # 🔴 **This is why the repo no longer ignores GHSA-mh99-v99m-4gvg.** That ignore's
  # stated reason was "no patched version is compatible with minimatch@3's API", which
  # was true when it was written and stopped being true when the 1.x backport landed.
  # A patched 1.x means the override reaches everywhere and the ignore reaches nothing —
  # osv-scanner reports it as an unused ignore, which is how it was noticed.
  "brace-expansion@1": ">=1.1.18 <2"
  "brace-expansion@2": ">=2.1.4 <3"
  "brace-expansion@5": ">=5.0.9 <6"

  # GHSA-5p4m-2wfm-xmqj — js-yaml quadratic CPU in `!!omap` resolution. Via eslint's
  # `@eslint/eslintrc`.
  "js-yaml@4": ">=4.3.1 <5"

  # GHSA-mwp4-54f8-5fhr — ip-address decodes leading-zero octets as decimal where
  # resolvers read them as octal, so an SSRF filter and the resolver disagree. Via
  # license-checker-rseidelsohn → … → socks-proxy-agent.
  "ip-address": ">=10.3.1 <11"

  # GHSA-2v37-7h3g-55p8 — nanoid can loop indefinitely with a custom generator. Via
  # postcss → vite, so build-time only.
  "nanoid@3": ">=3.3.18 <4"

  # Found by osv-scanner and not by `pnpm audit`, because the audit job's
  # `--audit-level=high` filters them out while the OSV job fails on any severity.
  # A live demonstration that the two gates are not redundant.
  "postcss@8": ">=8.5.23 <9" # GHSA-fxqj-rqcc-2cmp
  "undici@6": ">=6.28.0 <7" # GHSA-8xcm-r25x-g524, -m8rv-5g2x-5cg5, -v3r7-h72x-cjcm

auditConfig:
  # Governs `pnpm audit` only. CI also runs osv-scanner, which reads its own ignores
  # from osv-scanner.toml — the same posture in a second format. Change one, change
  # the other.
  #
  # **Empty on purpose, as of 2026-08-15.** The one standing ignore
  # (GHSA-mh99-v99m-4gvg, brace-expansion) is gone: its reason was that no patched
  # version was compatible with minimatch@3's API, and the 1.1.18 backport made that
  # false. Both scanners now pass with nothing waved through. See the overrides above.
  ignoreGhsas: []
