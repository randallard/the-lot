# cargo-deny config: the Rust supply-chain gate (`rust supply chain` in CI).
# Run locally with `cargo deny check`.
#
# ADR-1024: every setting the gate depends on is written here, not left to cargo-deny's
# defaults, so a cargo-deny release that changes a default can't loosen the gate without a diff.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# ADR-1024: report unmaintained crates anywhere in the graph, transitive ones included.
# cargo-deny 0.22 changed the default to "workspace" (direct dependencies only).
unmaintained = "all"
# Each ignore states its reason and when to revisit it, e.g.
#   { id = "RUSTSEC-YYYY-NNNN", reason = "build-time only via x -> y; revisit on x 2.0" },
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Adding one is a reviewed change to this file.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; they aren't wildcards in the risky sense.
allow-wildcard-paths = true
# ADR-1008: known-bad crates go here, each with a reason, e.g.
#   { crate = "name", reason = "why it is banned" },
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
